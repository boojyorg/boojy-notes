name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a PR cancels that PR's run still in flight; its result would
# describe a commit nobody is looking at. Master runs are never cancelled, so
# every merge keeps a result of its own (each takes a group of its own: one
# shared group would queue them, and a queued run is dropped for a newer one).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Independent jobs run side by side, so the wall clock follows the slowest
# (an Electron shard) rather than their sum. Measured 2026-09-06 on
# the serial layout: checks and unit tests ~70 s, web E2E ~15 s, Electron ~180 s
# with two workers; serially that was ~270 s of a ~4.5 min job. Each job
# installs for itself (a cache hit, ~10 s); nothing is passed between them.
# The `ci` job at the end is the one status branch protection requires; it
# only reports whether every job above succeeded.

jobs:
  checks:
    name: checks, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 22 (LTS): Node 24 hangs `playwright install --with-deps` on the
          # GitHub runner image. Actions themselves run on Node 24 via @v6.
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level critical
      - name: Lint and format check
        run: pnpm check
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test:coverage
      - name: Build
        run: ELECTRON_DISABLE=1 pnpm build

  web-e2e:
    name: web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `playwright install --with-deps` has stalled CI twice, both times in its
      # apt half — and the apt half buys us nothing. Every shared library Chromium
      # links against is already present on the ubuntu-latest image (all 25 report
      # "is already the newest version"); the only thing apt actually fetches is
      # ~21MB of CJK/Cyrillic/Thai fonts, off a mirror that has been serving at
      # ~100kB/s. This suite renders none of them — no visual snapshots, no
      # non-Latin fixtures — so install the browser and skip apt entirely. If a
      # future runner image does drop a library, Chromium fails to launch naming
      # the missing dependency: seconds, and legible, rather than a silent hang.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 300 pnpm exec playwright install chromium && exit 0
            echo "::warning::playwright install chromium attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          exit 1
      # The web server builds the web bundle itself (playwright.config.js).
      - name: E2E tests
        timeout-minutes: 15
        run: pnpm test:e2e

  # The Electron suite is split across six runners (Playwright's --shard,
  # by test), two workers each: it is most of CI's wall clock, and it waits on
  # the app's own debounces rather than the CPU, so more machines is the lever
  # and a faster one is not. Each shard builds for itself (~5 s).
  electron-e2e:
    name: Electron E2E (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The real desktop app against a throwaway vault. Needs a display: the
      # harness starts an Xvfb per worker (two windows on one shared display
      # stole each other's focus and pointer, the bulk of the flakes) and shows
      # the window there (a hidden one ticks no animation frames, which stalled
      # every Playwright action: 672 s → 267 s, 2026-09-14). Builds its own
      # dist and dist-electron, and drives the electron binary from
      # node_modules, so no Playwright browser download.
      - name: Build
        run: pnpm exec vite build
      - name: Electron core-journey tests
        timeout-minutes: 15
        run: pnpm exec playwright test -c playwright.electron.config.ts --shard=${{ matrix.shard }}/6

  # The single status branch protection requires. Runs even when a job above
  # failed or was cancelled, and reports that as a failure of its own.
  ci:
    needs: [checks, web-e2e, electron-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "web-e2e: ${{ needs.web-e2e.result }}"
          echo "electron-e2e: ${{ needs.electron-e2e.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.web-e2e.result }}" = success
          test "${{ needs.electron-e2e.result }}" = success
