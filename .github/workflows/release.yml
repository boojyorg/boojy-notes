name: Release

on:
  push:
    tags:
      - "v*"
  # By hand, for a branch: the installers are built as a tag would build them
  # but published nowhere; they wait on the run's page (Artifacts) for a try
  # in a virtual machine.
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A tag's release is checked and opened as one draft before anything is
  # built: every platform's build then uploads into it (electron-builder
  # uploads into an existing draft of the version's name). Left to the
  # builds, two raced to create it and split the files between two drafts.
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Mostly waiting for the tagged commit's CI run, which takes about 10 minutes.
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: The tag is package.json's version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not package.json's version (v$version); electron-builder names the release after package.json, so the two must agree."
            exit 1
          fi

      # Only a commit CI has passed is released. A tag pushed straight after
      # the release PR's merge waits here for master's run on that commit.
      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on $GITHUB_SHA."
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI did not pass on $GITHUB_SHA. Fix it, then tag a commit whose run is green."
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA ($attempt/60)."
            sleep 30
          done
          echo "::error::No green CI run for $GITHUB_SHA within 30 minutes."
          exit 1

      - name: Open the release as one draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          if ! node .github/scripts/release-notes.mjs "$version" > "$notes"; then
            # A rehearsal (v1.2.0-rc.1) needs no changelog section; a release does.
            case "$version" in
              *-*) echo "A rehearsal of $GITHUB_REF_NAME, never published." > "$notes" ;;
              *) exit 1 ;;
            esac
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$existing" != 0 ]; then
            echo "A release for $GITHUB_REF_NAME exists already; the builds upload into it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$notes"

  build:
    needs: prepare
    # A build by hand has no prepare job (skipped), and still builds.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    # Measured on the first signed and notarized run (2026-09-11, v0.7.0-rc.3):
    # macOS 3m34s end to end, of which notarization was 2m20s; Windows 2m26s.
    # The cap stays at 45 despite ~12x headroom because the variable is Apple's
    # notarization queue, not this build: it is minutes when quiet and has been
    # reported at 20m+ when not, and a cap that kills a submission mid-queue
    # wastes the whole run. A CI job once burned 6h1m unnoticed; nothing here
    # should ever be allowed to sit that long.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Node 22 (LTS): Node 24 hangs `playwright install --with-deps` in CI.
          # Actions themselves run on Node 24 via @v6.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for signing certificate
        id: cert-check
        if: runner.os == 'macOS'
        shell: bash
        run: echo "has_cert=${{ secrets.MACOS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      # @electron/notarize wants a filesystem path to the .p8, not its contents,
      # so the base64 secret is written out before the build and removed after.
      # Outside the workspace, so no glob in `files` can ever pack it.
      - name: Write the App Store Connect API key
        id: api-key
        if: runner.os == 'macOS' && steps.cert-check.outputs.has_cert == 'true'
        shell: bash
        run: |
          key_dir="$RUNNER_TEMP/asc-key"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_B64 }}" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      # macOS: signed build (when certificate secrets are configured)
      #
      # Notarization authenticates with an App Store Connect *Team* API key, not
      # an Apple ID and app-specific password: the password died with Audio's
      # June release credentials and took two rehearsals with it, and a team key
      # does not expire with an Apple ID password. APPLE_ID and
      # APPLE_APP_SPECIFIC_PASSWORD must stay out of this step's env —
      # electron-builder checks the Apple ID pair first and returns early, so
      # their presence would silently reinstate the dead path.
      - name: Build and package (macOS signed)
        if: runner.os == 'macOS' && steps.cert-check.outputs.has_cert == 'true'
        run: pnpm build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY: ${{ steps.api-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove the App Store Connect API key
        if: always() && runner.os == 'macOS' && steps.api-key.outputs.path != ''
        shell: bash
        run: rm -f "${{ steps.api-key.outputs.path }}"

      # macOS: unsigned build (when no certificate secrets)
      - name: Build and package (macOS unsigned)
        if: runner.os == 'macOS' && steps.cert-check.outputs.has_cert != 'true'
        run: pnpm build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows build
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: pnpm build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux build: an AppImage, which runs on most distributions and updates
      # itself (latest-linux.yml), and a .deb for Ubuntu and Debian (installed
      # like any package; updated by installing the next one). Each for Intel
      # (x64) and ARM (arm64: ARM laptops, and Ubuntu in a VM on an Apple Mac),
      # built from the one x64 runner. Unsigned, as both usually are.
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: pnpm build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers (a build by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # Every build is in the draft: put its names right, check it is whole and
  # its update manifests match the files, then publish it. A failed check
  # publishes nothing and leaves the draft to look at.
  publish:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Downloads the four installers the update manifests name (~500 MB).
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check the draft and publish it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          drafts=$(gh api "repos/$repo/releases?per_page=50" \
            --jq "[.[] | select(.draft and .tag_name == \"$tag\")]")
          if [ "$(jq length <<<"$drafts")" != 1 ]; then
            echo "::error::Expected one draft for $tag, found $(jq length <<<"$drafts")."
            exit 1
          fi
          id=$(jq '.[0].id' <<<"$drafts")

          # The uploader turns the space in "Boojy Notes" into a dot in one
          # name (the Mac zip's blockmap); the update manifests ask for a hyphen.
          for pair in $(jq -r '.[0].assets[] | select(.name | startswith("Boojy.Notes-")) | "\(.id)=\(.name)"' <<<"$drafts"); do
            name="${pair#*=}"
            fixed="Boojy-Notes-${name#Boojy.Notes-}"
            gh api -X PATCH "repos/$repo/releases/assets/${pair%%=*}" -f name="$fixed" >/dev/null
            echo "Renamed $name to $fixed."
          done

          assets=$(gh api "repos/$repo/releases/$id" --jq '[.assets[] | {id, name}]')
          expected=$(printf '%s\n' \
            "Boojy-Notes-$version-amd64.deb" \
            "Boojy-Notes-$version-arm64-mac.zip" \
            "Boojy-Notes-$version-arm64-mac.zip.blockmap" \
            "Boojy-Notes-$version-arm64.AppImage" \
            "Boojy-Notes-$version-arm64.deb" \
            "Boojy-Notes-$version-arm64.dmg" \
            "Boojy-Notes-$version-arm64.dmg.blockmap" \
            "Boojy-Notes-$version-x86_64.AppImage" \
            "Boojy-Notes-Setup-$version.exe" \
            "Boojy-Notes-Setup-$version.exe.blockmap" \
            latest-linux-arm64.yml latest-linux.yml latest-mac.yml latest.yml | sort)
          actual=$(jq -r '.[].name' <<<"$assets" | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::The draft's files are not the release's 14."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

          fetch() {
            gh api -H "Accept: application/octet-stream" \
              "repos/$repo/releases/assets/$(jq -r --arg n "$1" '.[] | select(.name == $n) | .id' <<<"$assets")" > "$RUNNER_TEMP/$1"
          }
          # Each manifest names the file an update downloads and its sha512:
          # the file in the draft must be that file.
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            fetch "$manifest"
            file=$(sed -n 's/^path: //p' "$RUNNER_TEMP/$manifest")
            want=$(sed -n 's/^sha512: //p' "$RUNNER_TEMP/$manifest")
            fetch "$file"
            got=$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$file" | base64 -w0)
            if [ "$got" != "$want" ]; then
              echo "::error::$file does not match the sha512 in $manifest."
              exit 1
            fi
            echo "$manifest: $file matches."
            rm -f "$RUNNER_TEMP/$file"
          done

          case "$version" in
            *-*)
              echo "$tag is a rehearsal: checked, and left as a draft."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          gh api -X PATCH "repos/$repo/releases/$id" -F draft=false >/dev/null
          # Sent with draft=false, make_latest is silently dropped: its own request.
          gh api -X PATCH "repos/$repo/releases/$id" -f make_latest=true >/dev/null
          echo "Published $tag."
          echo "published=true" >> "$GITHUB_OUTPUT"

  # A release published with the workflow's own token fires no other
  # workflow, so boojy.org's rebuild is called from here.
  site:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/site-rebuild.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
